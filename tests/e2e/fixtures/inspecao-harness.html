<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Harness da inspeção</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:24px}.nota{font-size:32px}.bloqueado,.erro{color:#ff2638}.ok{color:#31d17c}button{margin:8px;padding:10px}</style>
<h1>Inspeção fictícia</h1><div id="resultado"></div>
<section aria-label="Integração fictícia"><button id="sincronizar">Sincronizar fixture</button><button id="excluir">Excluir fixture</button><div id="estado">ocioso</div><div id="operacoes">0</div></section>
<script src="/public/assets/js/inspecao-core.js"></script><script>
const itens=[{id:'1.1',critico:false},{id:'1.2',critico:true},{id:'1.3',critico:false}];
function avaliar(notas){const c=window.LDInspecaoCore,media=c.calcularNota(itens,notas),faixa=c.classificarNota(media),bloqueado=c.estaBloqueado(itens,notas);resultado.innerHTML=`<div class="nota">${media===null?'—':Math.round(media)}</div><div class="faixa">${faixa?.rotulo||'SEM NOTAS'}</div><div class="estado ${bloqueado?'bloqueado':'ok'}">${bloqueado?'BLOQUEADO':'LIBERADO'}</div>`}
window.avaliar=avaliar;avaliar({});
</script><script type="module">
import { criarRepositorioInspecao } from '/public/assets/js/inspecao-repository.js';
import { criarServicoInspecao } from '/public/assets/js/inspecao-service.js';
const log=[];
const repositorio=criarRepositorioInspecao({db:{ficticio:true},criarReferencia:(_db,c,id)=>`${c}/${id}`,criarLote:()=>({set:(ref,dados,config)=>log.push({tipo:'set',ref,dados,config}),delete:ref=>log.push({tipo:'delete',ref}),commit:async()=>{}}),agora:()=> '2026-11-03T12:00:00.000Z',emailAtual:()=> 'e2e@exemplo.invalid'});
const servico=criarServicoInspecao({repositorio,usuarioAtual:()=>({uid:'e2e'}),aoMudarEstado:e=>{estado.textContent=e.estado;estado.className=e.estado==='erro'?'erro':'ok'}});
const atualizar=()=>operacoes.textContent=String(log.length);
sincronizar.onclick=async()=>{await servico.sincronizar('ld_inspecoes_v2',[{id:'LAUDO-E2E-001',codigo:'IMOVEL-E2E-001'}],new Set());atualizar()};
excluir.onclick=async()=>{await servico.excluir('ld_inspecoes_v2','LAUDO-E2E-001');atualizar()};
window.__INTEGRACAO_PRONTA=true;window.__OPERACOES=log;
</script></html>
