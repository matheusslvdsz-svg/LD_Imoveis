<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Harness da inspeção</title>
<style>body{font-family:Arial;background:#111;color:#fff;padding:24px}.nota{font-size:32px}.bloqueado{color:#ff2638}.ok{color:#31d17c}</style>
<h1>Inspeção fictícia</h1><div id="resultado"></div>
<script src="/public/assets/js/inspecao-core.js"></script><script>
const itens=[{id:'1.1',critico:false},{id:'1.2',critico:true},{id:'1.3',critico:false}];
function avaliar(notas){const c=window.LDInspecaoCore,media=c.calcularNota(itens,notas),faixa=c.classificarNota(media),bloqueado=c.estaBloqueado(itens,notas);resultado.innerHTML=`<div class="nota">${media===null?'—':Math.round(media)}</div><div class="faixa">${faixa?.rotulo||'SEM NOTAS'}</div><div class="estado ${bloqueado?'bloqueado':'ok'}">${bloqueado?'BLOQUEADO':'LIBERADO'}</div>`}
window.avaliar=avaliar;avaliar({});
</script></html>
